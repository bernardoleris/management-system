spring:
  flyway:
    enabled: true
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

security:
  jwt:
    secret: test-secret-key-for-testing-purposes-only
    expiration: 3600000
    refresh-expiration: 604800000
